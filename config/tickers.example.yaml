# Copy fields into tickers.yaml or point NEOTRADE_TICKERS at a custom file.

universe:
  name: example-universe
  currency: USD
  exchange_bias: NYSE_NASDAQ

tickers:
  - symbol: NVDA
    name: NVIDIA
    sector: Technology
    sleeve: growth
  - symbol: JNJ
    name: Johnson & Johnson
    sector: Healthcare
    sleeve: defensive

data:
  cache_dir: data/cache
  provider: yfinance
  default_period: 1y
  default_interval: 1d
  max_age_hours: 24

risk:
  max_position_pct: 0.08
  growth_target_pct: 0.68
  defensive_target_pct: 0.32
  max_new_positions: 8
  min_notional: 25.0
  min_cash_pct: 0.02
  buy_threshold: 0.55
  sell_threshold: 0.45
  paper_only: true
