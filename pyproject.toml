[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neotrade"
version = "0.1.0"
description = "Local-first paper-trading decision-support app on MacBook Neo"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "pydantic"]

[project.scripts]
neotrade = "neotrade.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neotrade*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
