[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neotrade"
version = "0.1.0"
description = "Local-first paper-trading decision-support app on MacBook Neo"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.0",
  "langgraph>=0.2.0",
  "lightgbm>=4.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "streamlit>=1.32",
  "websockets>=12.0",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
neotrade = "neotrade.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neotrade*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
